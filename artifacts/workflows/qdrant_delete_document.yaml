---
workflow_id: qdrant_delete_document
version: 1.0.0
display_name: Qdrant delete document
description: Delete all chunks of one document in the selected Qdrant connection.
  This removes external data; choose the project connection before execution.
enabled: true
trigger:
  confidence_threshold: 0.0
settings:
  execution_graph:
    schema_version: 1
    entry:
      kind: step
      id: delete_document
    edges:
    - source:
        kind: step
        id: delete_document
      outcome:
        name: success
      target:
        kind: step
        id: done
      rework: false
  callable:
    enabled: true
    trigger_channels:
    - ui
    - api
    - mcp
    input_mode: fields
    strict_inputs: true
    expected_inputs:
    - name: document_id
      type: text
      required: true
      description: Document id
    output_mode: variables
    expected_outputs:
    - name: deletion_result
      type: object
      required: false
      description: Deletion result
    expected_artifacts: []
    side_effects:
    - external_write
tags:
- qdrant
- rag
steps:
- step_id: delete_document
  display_name: Delete document
  step_kind: connector
  connector_id: qdrant.delete_document
  connector_install_id: qdrant
  override:
    connector:
      extension_id: flowsteward.qdrant
      action_id: delete_document
  input_mapping_jsonb:
    document_id: state.inputs.document_id
  output_mapping_jsonb:
    result: state.deletion_result
  connection_binding_jsonb: {}
- step_id: done
  display_name: Done
  step_kind: stop_success
  override:
    stop_success:
      message: Document deleted.
groups: []
