name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    uses: Flow-Steward/extensions/.github/workflows/release-extension.yml@62c05c526d5fb0bedad24105e493774e594a7007
    with:
      tag: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
