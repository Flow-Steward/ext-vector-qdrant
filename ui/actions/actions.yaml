actions:
- action_id: prepare_document
  workflow_visible: true
  title: Prepare document
  description: Prepare document.
  required_scopes:
  - extension:invoke
  handler:
    mode: extension
  parameters:
  - name: document_id
    type: string
    required: true
  - name: text
    type: string
    required: true
  - name: source_uri
    type: string
    required: false
  - name: title
    type: string
    required: false
  - name: metadata
    type: object
    required: false
  - name: chunk_size
    type: integer
    required: false
  - name: overlap
    type: integer
    required: false
  - name: max_chunks
    type: integer
    required: false
  result_fields:
  - result.document_id
  - result.chunks
  - result.texts
  - result.chunk_count
  - result.content_hash
  error_codes:
  - invalid_payload
  - invalid_connection
  - unknown_action
  - effect_claim_required
  - test_mode_suppressed
  - authentication_failed
  - not_found
  - conflict
  - rate_limited
  - provider_unavailable
  - invalid_provider_response
  - response_too_large
  - network_blocked
  mutates_platform: false
