actions:
- action_id: prepare_document
  workflow_visible: true
  title: Split document text into chunks
  description: Split text locally into overlapping Unicode chunks with stable IDs, source information and a content
    hash. Returns chunks and ordered texts for an embedding step; does not call Qdrant or generate vectors.
  required_scopes:
  - extension:invoke
  handler:
    mode: extension
  parameters:
  - name: document_id
    type: string
    required: true
  - name: text
    type: string
    required: true
  - name: source_uri
    type: string
    required: false
  - name: title
    type: string
    required: false
  - name: metadata
    type: object
    required: false
  - name: chunk_size
    type: integer
    required: false
  - name: overlap
    type: integer
    required: false
  - name: max_chunks
    type: integer
    required: false
  result_fields:
  - result.document_id
  - result.chunks
  - result.texts
  - result.chunk_count
  - result.content_hash
  error_codes:
  - invalid_payload
  - invalid_connection
  - unknown_action
  - effect_claim_required
  - test_mode_suppressed
  - authentication_failed
  - not_found
  - conflict
  - rate_limited
  - provider_unavailable
  - invalid_provider_response
  - response_too_large
  - network_blocked
  mutates_platform: false
- action_id: prepare_query
  workflow_visible: true
  title: Prepare a question for embedding
  description: Validate a question and return its text in the shape needed by a later embedding step. Runs locally;
    does not search Qdrant or call an LLM.
  required_scopes:
  - extension:invoke
  handler:
    mode: extension
  parameters:
  - name: question
    type: string
    required: true
  result_fields:
  - result.question
  - result.texts
  error_codes:
  - invalid_payload
  - invalid_connection
  - unknown_action
  - effect_claim_required
  - test_mode_suppressed
  - authentication_failed
  - not_found
  - conflict
  - rate_limited
  - provider_unavailable
  - invalid_provider_response
  - response_too_large
  - network_blocked
  mutates_platform: false
- action_id: finalize_answer
  workflow_visible: true
  title: Validate answer citations
  description: Check an answer’s citation markers and cited IDs against the sources returned by search. Returns
    cited sources or an abstention; citation consistency does not prove factual support and no LLM is called.
  required_scopes:
  - extension:invoke
  handler:
    mode: extension
  parameters:
  - name: answer
    type: string
    required: true
  - name: cited_source_ids
    type: array
    required: true
  - name: sources
    type: array
    required: true
  - name: abstained
    type: boolean
    required: false
  result_fields:
  - result.answer
  - result.sources
  - result.citation_count
  - result.grounded
  - result.abstained
  error_codes:
  - invalid_payload
  - invalid_connection
  - unknown_action
  - effect_claim_required
  - test_mode_suppressed
  - authentication_failed
  - not_found
  - conflict
  - rate_limited
  - provider_unavailable
  - invalid_provider_response
  - response_too_large
  - network_blocked
  mutates_platform: false
- action_id: create_collection
  workflow_visible: true
  title: Create a vector collection
  description: Create the connection collection with chosen dimensions and distance, then create keyword indexes
    for scoped retrieval. Requires Qdrant collection-administration access; generate embeddings separately.
  required_scopes:
  - extension:invoke
  handler:
    mode: extension
  parameters:
  - name: connection_ref
    type: string
    required: true
  - name: dimensions
    type: integer
    required: true
  - name: distance
    type: string
    required: false
  result_fields:
  - result.collection
  - result.created
  error_codes:
  - invalid_payload
  - invalid_connection
  - unknown_action
  - effect_claim_required
  - test_mode_suppressed
  - authentication_failed
  - not_found
  - conflict
  - rate_limited
  - provider_unavailable
  - invalid_provider_response
  - response_too_large
  - network_blocked
  mutates_platform: false
- action_id: get_collection
  workflow_visible: true
  title: Inspect a vector collection
  description: Read the connection collection configuration and vector schema. Use to verify dimensions, distance
    and any named vector before ingestion.
  required_scopes:
  - extension:invoke
  handler:
    mode: extension
  parameters:
  - name: connection_ref
    type: string
    required: true
  result_fields:
  - result.collection
  - result.info
  error_codes:
  - invalid_payload
  - invalid_connection
  - unknown_action
  - effect_claim_required
  - test_mode_suppressed
  - authentication_failed
  - not_found
  - conflict
  - rate_limited
  - provider_unavailable
  - invalid_provider_response
  - response_too_large
  - network_blocked
  mutates_platform: false
- action_id: upsert_points
  workflow_visible: true
  title: Save or replace vector points by ID
  description: Save 1–128 raw points with numeric vectors and optional payload. Logical IDs are isolated by account,
    project and connection; generate matching embeddings before this step.
  required_scopes:
  - extension:invoke
  handler:
    mode: extension
  parameters:
  - name: connection_ref
    type: string
    required: true
  - name: points
    type: array
    required: true
  result_fields:
  - result.upserted_count
  - result.ids
  error_codes:
  - invalid_payload
  - invalid_connection
  - unknown_action
  - effect_claim_required
  - test_mode_suppressed
  - authentication_failed
  - not_found
  - conflict
  - rate_limited
  - provider_unavailable
  - invalid_provider_response
  - response_too_large
  - network_blocked
  mutates_platform: false
- action_id: get_points
  workflow_visible: true
  title: Read vector points by ID
  description: Read 1–128 logical point IDs within this account, project and connection. Returns stored point data
    without a similarity search.
  required_scopes:
  - extension:invoke
  handler:
    mode: extension
  parameters:
  - name: connection_ref
    type: string
    required: true
  - name: ids
    type: array
    required: true
  result_fields:
  - result.points
  error_codes:
  - invalid_payload
  - invalid_connection
  - unknown_action
  - effect_claim_required
  - test_mode_suppressed
  - authentication_failed
  - not_found
  - conflict
  - rate_limited
  - provider_unavailable
  - invalid_provider_response
  - response_too_large
  - network_blocked
  mutates_platform: false
- action_id: delete_points
  workflow_visible: true
  title: Delete vector points by IDs or filter
  description: Delete raw points within this connection scope using explicit IDs or a nonempty Qdrant filter. Supply
    one selection method; does not delete the collection.
  required_scopes:
  - extension:invoke
  handler:
    mode: extension
  parameters:
  - name: connection_ref
    type: string
    required: true
  - name: ids
    type: array
    required: false
  - name: filter
    type: object
    required: false
  result_fields:
  - result.deleted
  error_codes:
  - invalid_payload
  - invalid_connection
  - unknown_action
  - effect_claim_required
  - test_mode_suppressed
  - authentication_failed
  - not_found
  - conflict
  - rate_limited
  - provider_unavailable
  - invalid_provider_response
  - response_too_large
  - network_blocked
  mutates_platform: false
- action_id: replace_document
  workflow_visible: true
  title: Replace a document and its embeddings
  description: Save prepared chunks with one matching embedding per chunk, then remove stale chunks for the same
    document. Requires ordered vectors from an embedding step; multiple Qdrant requests are not atomic.
  required_scopes:
  - extension:invoke
  handler:
    mode: extension
  parameters:
  - name: connection_ref
    type: string
    required: true
  - name: document_id
    type: string
    required: true
  - name: chunks
    type: array
    required: true
  - name: vectors
    type: array
    required: true
  result_fields:
  - result.document_id
  - result.chunk_count
  - result.replaced
  error_codes:
  - invalid_payload
  - invalid_connection
  - unknown_action
  - effect_claim_required
  - test_mode_suppressed
  - authentication_failed
  - not_found
  - conflict
  - rate_limited
  - provider_unavailable
  - invalid_provider_response
  - response_too_large
  - network_blocked
  mutates_platform: false
  contract:
    serialization:
      resource: document
      key_fields:
      - document_id
- action_id: delete_document
  workflow_visible: true
  title: Delete all chunks of a document
  description: Delete all stored chunks for a stable document ID within this account, project and connection. Does
    not delete the collection or raw points.
  required_scopes:
  - extension:invoke
  handler:
    mode: extension
  parameters:
  - name: connection_ref
    type: string
    required: true
  - name: document_id
    type: string
    required: true
  result_fields:
  - result.document_id
  - result.deleted
  error_codes:
  - invalid_payload
  - invalid_connection
  - unknown_action
  - effect_claim_required
  - test_mode_suppressed
  - authentication_failed
  - not_found
  - conflict
  - rate_limited
  - provider_unavailable
  - invalid_provider_response
  - response_too_large
  - network_blocked
  mutates_platform: false
  contract:
    serialization:
      resource: document
      key_fields:
      - document_id
- action_id: search
  workflow_visible: true
  title: Search similar text and build context
  description: Search the connection collection using a query embedding, optional Qdrant filter and score threshold.
    Returns matches, exact source excerpts and bounded context for an answer step; does not generate embeddings
    or an answer.
  required_scopes:
  - extension:invoke
  handler:
    mode: extension
  parameters:
  - name: connection_ref
    type: string
    required: true
  - name: vector
    type: array
    required: false
  - name: query_vectors
    type: array
    required: false
  - name: filter
    type: object
    required: false
  - name: top_k
    type: integer
    required: false
  - name: score_threshold
    type: number
    required: false
  - name: max_context_characters
    type: integer
    required: false
  result_fields:
  - result.matches
  - result.context
  - result.sources
  - result.match_count
  - result.truncated
  - result.answerable
  error_codes:
  - invalid_payload
  - invalid_connection
  - unknown_action
  - effect_claim_required
  - test_mode_suppressed
  - authentication_failed
  - not_found
  - conflict
  - rate_limited
  - provider_unavailable
  - invalid_provider_response
  - response_too_large
  - network_blocked
  mutates_platform: false
- action_id: ensure_indexes
  workflow_visible: true
  title: Ensure retrieval payload indexes
  description: Create keyword indexes for _fs_scope, _fs_kind and document_id on an existing collection. Required
    for scoped retrieval under Qdrant strict mode; needs administration privileges.
  required_scopes:
  - extension:invoke
  handler:
    mode: extension
  parameters:
  - name: connection_ref
    type: string
    required: true
  result_fields:
  - result.collection
  - result.indexes_ready
  error_codes:
  - invalid_payload
  - invalid_connection
  - unknown_action
  - effect_claim_required
  - test_mode_suppressed
  - authentication_failed
  - not_found
  - conflict
  - rate_limited
  - provider_unavailable
  - invalid_provider_response
  - response_too_large
  - network_blocked
  mutates_platform: false
