manifest_version: 2
extension_id: flowsteward.qdrant
kind: tool_provider
version: 1.0.1
release_stage: active
display_name: Qdrant Vector Store
description: Document indexing, dense vector retrieval and cited RAG workflows.
lifecycle:
  data_schema_version: 1
  data_migrations: []
vendor:
  name: Flow Steward
listing:
  category: data
  tags:
  - qdrant
  - vector
  - rag
  summary: Read and write vectors and build RAG workflows with source citations.
features:
- tool
- action
- artifact_bundle
required_scopes:
- extension:invoke
egress:
  connection_fields:
  - qdrant.base_url
account_scope:
  scope_type: project
  description: Explicit project connections to dedicated Qdrant collections.
entrypoint:
  mode: subprocess
  command:
  - python3
  - main.py
  timeout_seconds: 120
health:
  command:
  - python3
  - health.py
  timeout_seconds: 5
ui_manifest: ui/ui_manifest.yaml
action_manifest: ui/actions/actions.yaml
python_requirements: []
runtime:
  contract_version: extension_host_v2
  compatibility:
    platform_min: 1.4.0
  extension_contract_v2:
    connection_types: contracts/connection_types.yaml
    operation_manifest: contracts/operation_manifest.yaml
    step_ui_manifest: contracts/step_ui_manifest.yaml
external_effects:
- operation_id: create_collection
  effect_kind: database_write
  channel: qdrant
  idempotency: required
  test_mode_behavior: suppress
- operation_id: delete_document
  effect_kind: database_write
  channel: qdrant
  idempotency: required
  test_mode_behavior: suppress
- operation_id: delete_points
  effect_kind: database_write
  channel: qdrant
  idempotency: required
  test_mode_behavior: suppress
- operation_id: replace_document
  effect_kind: database_write
  channel: qdrant
  idempotency: required
  test_mode_behavior: suppress
- operation_id: upsert_points
  effect_kind: database_write
  channel: qdrant
  idempotency: required
  test_mode_behavior: suppress
- operation_id: ensure_indexes
  effect_kind: database_write
  channel: qdrant
  idempotency: required
  test_mode_behavior: suppress
machine_auth:
  service_account_key: svc_ext_qdrant
  required_scopes:
  - extension:invoke
