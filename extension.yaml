manifest_version: 2
extension_id: flowsteward.qdrant
kind: tool_provider
version: "1.0.4"
release_stage: active
display_name: Qdrant Vector Store
description: |-
  Build document retrieval and cited-answer workflows around a Qdrant collection. Prepare text into overlapping chunks with stable IDs and provenance, replace a document’s stored chunks, delete a document, or work directly with vector points through upsert, get and delete operations. Dense vector search accepts filters and score thresholds and returns matches, source identifiers, exact excerpts and assembled context for downstream steps.

  Collection actions create or inspect the selected collection and ensure the payload indexes required for scoped retrieval. Data access is tied to the account, project and connection. Query preparation and answer finalization support source-based responses: finalization checks citation IDs and markers, and empty retrieval produces an abstention.

  Bundled workflows cover text ingestion, file ingestion, questions and document deletion. They compose Cohere Retrieval for embeddings, Docling for file conversion and the project’s configured answer agent; those services need their own installation and connections. The Qdrant connector itself does not generate embeddings or run an LLM. Use matching embedding models and dimensions for ingestion and questions. Citation checks validate references against retrieved sources, helping later workflow steps present excerpts and citations alongside the answer.
lifecycle:
  data_schema_version: 1
  data_migrations: []
vendor:
  name: Flow Steward
listing:
  category: data
  tags:
  - qdrant
  - vector
  - rag
  summary: "Index document chunks in Qdrant, search dense vectors, and compose question-answering workflows with source citations."
  setup_summary: "Configure a project connection with Qdrant API origin, collection, optional vector name and API key, then create the collection or ensure payload indexes on an existing one. For bundled workflows, install Cohere Retrieval and Docling, import the workflow/agent/skill artifacts, select their connections and configure the project answer model."
features:
- tool
- action
- artifact_bundle
required_scopes:
- extension:invoke
egress:
  connection_fields:
  - qdrant.base_url
account_scope:
  scope_type: project
  description: Explicit project connections to dedicated Qdrant collections.
entrypoint:
  mode: subprocess
  command:
  - python3
  - main.py
  timeout_seconds: 120
health:
  command:
  - python3
  - health.py
  timeout_seconds: 5
ui_manifest: ui/ui_manifest.yaml
action_manifest: ui/actions/actions.yaml
python_requirements: []
runtime:
  contract_version: extension_host_v2
  compatibility:
    platform_min: 1.4.0
  extension_contract_v2:
    connection_types: contracts/connection_types.yaml
    operation_manifest: contracts/operation_manifest.yaml
    step_ui_manifest: contracts/step_ui_manifest.yaml
external_effects:
- operation_id: create_collection
  effect_kind: database_write
  channel: qdrant
  idempotency: required
  test_mode_behavior: suppress
- operation_id: delete_document
  effect_kind: database_write
  channel: qdrant
  idempotency: required
  test_mode_behavior: suppress
- operation_id: delete_points
  effect_kind: database_write
  channel: qdrant
  idempotency: required
  test_mode_behavior: suppress
- operation_id: replace_document
  effect_kind: database_write
  channel: qdrant
  idempotency: required
  test_mode_behavior: suppress
- operation_id: upsert_points
  effect_kind: database_write
  channel: qdrant
  idempotency: required
  test_mode_behavior: suppress
- operation_id: ensure_indexes
  effect_kind: database_write
  channel: qdrant
  idempotency: required
  test_mode_behavior: suppress
machine_auth:
  service_account_key: svc_ext_qdrant
  required_scopes:
  - extension:invoke
