connection_types:
- connection_type_id: qdrant
  display_name: Qdrant
  description: One project connection per collection. Same embedding model/dimensions
    for ingest and query.
  config_schema:
    type: object
    additionalProperties: false
    required:
    - base_url
    - collection
    properties:
      base_url:
        type: string
        title: Qdrant API origin
        minLength: 1
      collection:
        type: string
        title: Collection
        pattern: ^[A-Za-z0-9_-]{1,128}$
      vector_name:
        type: string
        title: Named vector (blank for default)
        maxLength: 128
      request_timeout_seconds:
        type: integer
        minimum: 1
        maximum: 60
        title: Request timeout seconds
        default: 30
  secret_schema:
    type: object
    additionalProperties: false
    properties:
      api_key:
        type: string
        title: Qdrant API key
  capabilities:
    test_connection: false
    live_request: true
    workflow_trigger: false
    callback_ingress: false
  safety_profile:
    requires_https: false
    requires_host_allowlist: true
    stores_secret_values: false
