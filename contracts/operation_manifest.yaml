- operation_id: create_collection
  display_name: Create collection
  description: Create collection.
  operation_kind: action
  workflow_visible: true
  connection_type_ids:
  - qdrant
  category: retrieval
  inputs:
  - name: connection_ref
    value_type: connection_ref
    required: true
    display_name: Connection ref
  - name: dimensions
    value_type: integer
    required: true
    display_name: Dimensions
    schema:
      type: integer
      minimum: 1
      maximum: 65536
  - name: distance
    value_type: text
    required: false
    display_name: Distance
    schema:
      type: string
      enum:
      - Cosine
      - Dot
      - Euclid
      - Manhattan
  outputs:
  - name: collection
    value_type: text
  - name: created
    value_type: boolean
  result_fields:
  - result.collection
  - result.created
  error_codes:
  - invalid_payload
  - invalid_connection
