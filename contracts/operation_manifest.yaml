operations:
- operation_id: prepare_document
  display_name: Prepare document
  description: Prepare document.
  operation_kind: action
  workflow_visible: true
  connection_type_ids: []
  category: retrieval
  inputs:
  - name: document_id
    value_type: text
    required: true
    display_name: Document id
    schema:
      type: string
      minLength: 1
      maxLength: 256
  - name: text
    value_type: text
    required: true
    display_name: Text
    schema:
      type: string
      minLength: 1
  - name: source_uri
    value_type: text
    required: false
    display_name: Source uri
  - name: title
    value_type: text
    required: false
    display_name: Title
  - name: metadata
    value_type: json
    required: false
    display_name: Metadata
  - name: chunk_size
    value_type: integer
    required: false
    display_name: Chunk size
    schema:
      type: integer
      minimum: 128
      maximum: 16000
  - name: overlap
    value_type: integer
    required: false
    display_name: Overlap
    schema:
      type: integer
      minimum: 0
      maximum: 15999
  - name: max_chunks
    value_type: integer
    required: false
    display_name: Max chunks
    schema:
      type: integer
      minimum: 1
      maximum: 512
  outputs:
  - name: document_id
    value_type: text
  - name: chunks
    value_type: array
  - name: texts
    value_type: array
  - name: chunk_count
    value_type: integer
  - name: content_hash
    value_type: text
  result_fields:
  - result.document_id
  - result.chunks
  - result.texts
  - result.chunk_count
  - result.content_hash
  error_codes:
  - invalid_payload
  - invalid_connection
  - unknown_action
  - effect_claim_required
  - test_mode_suppressed
  - authentication_failed
  - not_found
  - conflict
  - rate_limited
  - provider_unavailable
  - invalid_provider_response
  - response_too_large
  - network_blocked
