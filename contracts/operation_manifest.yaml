operations:
- operation_id: prepare_document
  display_name: Split document text into chunks
  description: Split text locally into overlapping Unicode chunks with stable IDs, source information and a content
    hash. Returns chunks and ordered texts for an embedding step; does not call Qdrant or generate vectors.
  operation_kind: action
  workflow_visible: true
  connection_type_ids: []
  category: retrieval
  inputs:
  - name: document_id
    value_type: text
    required: true
    display_name: Stable document ID
    schema:
      type: string
      minLength: 1
      maxLength: 256
  - name: text
    value_type: text
    required: true
    display_name: Document text
    schema:
      type: string
      minLength: 1
  - name: source_uri
    value_type: text
    required: false
    display_name: Document source URI
  - name: title
    value_type: text
    required: false
    display_name: Document title
  - name: metadata
    value_type: json
    required: false
    display_name: Document metadata (JSON object)
  - name: chunk_size
    value_type: integer
    required: false
    display_name: Maximum characters per chunk
    schema:
      type: integer
      minimum: 128
      maximum: 16000
  - name: overlap
    value_type: integer
    required: false
    display_name: Overlap characters
    schema:
      type: integer
      minimum: 0
      maximum: 15999
  - name: max_chunks
    value_type: integer
    required: false
    display_name: Maximum chunks
    schema:
      type: integer
      minimum: 1
      maximum: 512
  outputs:
  - name: document_id
    value_type: text
  - name: chunks
    value_type: array
  - name: texts
    value_type: array
  - name: chunk_count
    value_type: integer
  - name: content_hash
    value_type: text
  result_fields:
  - result.document_id
  - result.chunks
  - result.texts
  - result.chunk_count
  - result.content_hash
  error_codes:
  - invalid_payload
  - invalid_connection
  - unknown_action
  - effect_claim_required
  - test_mode_suppressed
  - authentication_failed
  - not_found
  - conflict
  - rate_limited
  - provider_unavailable
  - invalid_provider_response
  - response_too_large
  - network_blocked
- operation_id: prepare_query
  display_name: Prepare a question for embedding
  description: Validate a question and return its text in the shape needed by a later embedding step. Runs locally;
    does not search Qdrant or call an LLM.
  operation_kind: action
  workflow_visible: true
  connection_type_ids: []
  category: retrieval
  inputs:
  - name: question
    value_type: text
    required: true
    display_name: Question to retrieve evidence for
    schema:
      type: string
      minLength: 1
  outputs:
  - name: question
    value_type: text
  - name: texts
    value_type: array
  result_fields:
  - result.question
  - result.texts
  error_codes:
  - invalid_payload
  - invalid_connection
  - unknown_action
  - effect_claim_required
  - test_mode_suppressed
  - authentication_failed
  - not_found
  - conflict
  - rate_limited
  - provider_unavailable
  - invalid_provider_response
  - response_too_large
  - network_blocked
- operation_id: finalize_answer
  display_name: Validate answer citations
  description: Check an answer’s citation markers and cited IDs against the sources returned by search. Returns
    cited sources or an abstention; citation consistency does not prove factual support and no LLM is called.
  operation_kind: action
  workflow_visible: true
  connection_type_ids: []
  category: retrieval
  inputs:
  - name: answer
    value_type: text
    required: true
    display_name: Answer with source markers
  - name: cited_source_ids
    value_type: array
    required: true
    display_name: Cited source IDs (JSON array)
  - name: sources
    value_type: array
    required: true
    display_name: Search sources (JSON array)
  - name: abstained
    value_type: boolean
    required: false
    display_name: Answer is an abstention
  outputs:
  - name: answer
    value_type: text
  - name: sources
    value_type: array
  - name: citation_count
    value_type: integer
  - name: grounded
    value_type: boolean
  - name: abstained
    value_type: boolean
  result_fields:
  - result.answer
  - result.sources
  - result.citation_count
  - result.grounded
  - result.abstained
  error_codes:
  - invalid_payload
  - invalid_connection
  - unknown_action
  - effect_claim_required
  - test_mode_suppressed
  - authentication_failed
  - not_found
  - conflict
  - rate_limited
  - provider_unavailable
  - invalid_provider_response
  - response_too_large
  - network_blocked
- operation_id: create_collection
  display_name: Create a vector collection
  description: Create the connection collection with chosen dimensions and distance, then create keyword indexes
    for scoped retrieval. Requires Qdrant collection-administration access; generate embeddings separately.
  operation_kind: action
  workflow_visible: true
  connection_type_ids:
  - qdrant
  category: retrieval
  inputs:
  - name: connection_ref
    value_type: connection_ref
    required: true
    display_name: Project connection
  - name: dimensions
    value_type: integer
    required: true
    display_name: Embedding dimensions
    schema:
      type: integer
      minimum: 1
      maximum: 65536
  - name: distance
    value_type: text
    required: false
    display_name: Vector distance metric
    schema:
      type: string
      enum:
      - Cosine
      - Dot
      - Euclid
      - Manhattan
  outputs:
  - name: collection
    value_type: text
  - name: created
    value_type: boolean
  result_fields:
  - result.collection
  - result.created
  error_codes:
  - invalid_payload
  - invalid_connection
  - unknown_action
  - effect_claim_required
  - test_mode_suppressed
  - authentication_failed
  - not_found
  - conflict
  - rate_limited
  - provider_unavailable
  - invalid_provider_response
  - response_too_large
  - network_blocked
- operation_id: get_collection
  display_name: Inspect a vector collection
  description: Read the connection collection configuration and vector schema. Use to verify dimensions, distance
    and any named vector before ingestion.
  operation_kind: action
  workflow_visible: true
  connection_type_ids:
  - qdrant
  category: retrieval
  inputs:
  - name: connection_ref
    value_type: connection_ref
    required: true
    display_name: Project connection
  outputs:
  - name: collection
    value_type: text
  - name: info
    value_type: json
  result_fields:
  - result.collection
  - result.info
  error_codes:
  - invalid_payload
  - invalid_connection
  - unknown_action
  - effect_claim_required
  - test_mode_suppressed
  - authentication_failed
  - not_found
  - conflict
  - rate_limited
  - provider_unavailable
  - invalid_provider_response
  - response_too_large
  - network_blocked
- operation_id: upsert_points
  display_name: Save or replace vector points by ID
  description: Save 1–128 raw points with numeric vectors and optional payload. Logical IDs are isolated by account,
    project and connection; generate matching embeddings before this step.
  operation_kind: action
  workflow_visible: true
  connection_type_ids:
  - qdrant
  category: retrieval
  inputs:
  - name: connection_ref
    value_type: connection_ref
    required: true
    display_name: Project connection
  - name: points
    value_type: array
    required: true
    display_name: Vector points (JSON array)
    schema:
      type: array
      minItems: 1
      maxItems: 128
  outputs:
  - name: upserted_count
    value_type: integer
  - name: ids
    value_type: array
  result_fields:
  - result.upserted_count
  - result.ids
  error_codes:
  - invalid_payload
  - invalid_connection
  - unknown_action
  - effect_claim_required
  - test_mode_suppressed
  - authentication_failed
  - not_found
  - conflict
  - rate_limited
  - provider_unavailable
  - invalid_provider_response
  - response_too_large
  - network_blocked
- operation_id: get_points
  display_name: Read vector points by ID
  description: Read 1–128 logical point IDs within this account, project and connection. Returns stored point data
    without a similarity search.
  operation_kind: action
  workflow_visible: true
  connection_type_ids:
  - qdrant
  category: retrieval
  inputs:
  - name: connection_ref
    value_type: connection_ref
    required: true
    display_name: Project connection
  - name: ids
    value_type: array
    required: true
    display_name: Logical point IDs (JSON array)
    schema:
      type: array
      minItems: 1
      maxItems: 128
  outputs:
  - name: points
    value_type: array
  result_fields:
  - result.points
  error_codes:
  - invalid_payload
  - invalid_connection
  - unknown_action
  - effect_claim_required
  - test_mode_suppressed
  - authentication_failed
  - not_found
  - conflict
  - rate_limited
  - provider_unavailable
  - invalid_provider_response
  - response_too_large
  - network_blocked
- operation_id: delete_points
  display_name: Delete vector points by IDs or filter
  description: Delete raw points within this connection scope using explicit IDs or a nonempty Qdrant filter. Supply
    one selection method; does not delete the collection.
  operation_kind: action
  workflow_visible: true
  connection_type_ids:
  - qdrant
  category: retrieval
  inputs:
  - name: connection_ref
    value_type: connection_ref
    required: true
    display_name: Project connection
  - name: ids
    value_type: array
    required: false
    display_name: Logical point IDs (JSON array)
    schema:
      type: array
      minItems: 1
      maxItems: 128
  - name: filter
    value_type: json
    required: false
    display_name: Qdrant payload filter (JSON)
  outputs:
  - name: deleted
    value_type: boolean
  result_fields:
  - result.deleted
  error_codes:
  - invalid_payload
  - invalid_connection
  - unknown_action
  - effect_claim_required
  - test_mode_suppressed
  - authentication_failed
  - not_found
  - conflict
  - rate_limited
  - provider_unavailable
  - invalid_provider_response
  - response_too_large
  - network_blocked
- operation_id: replace_document
  display_name: Replace a document and its embeddings
  description: Save prepared chunks with one matching embedding per chunk, then remove stale chunks for the same
    document. Requires ordered vectors from an embedding step; multiple Qdrant requests are not atomic.
  operation_kind: action
  workflow_visible: true
  connection_type_ids:
  - qdrant
  category: retrieval
  inputs:
  - name: connection_ref
    value_type: connection_ref
    required: true
    display_name: Project connection
  - name: document_id
    value_type: text
    required: true
    display_name: Stable document ID
  - name: chunks
    value_type: array
    required: true
    display_name: Prepared document chunks (JSON array)
    schema:
      type: array
      minItems: 1
      maxItems: 512
  - name: vectors
    value_type: array
    required: true
    display_name: Chunk embeddings (JSON matrix)
    schema:
      type: array
      minItems: 1
      maxItems: 512
  outputs:
  - name: document_id
    value_type: text
  - name: chunk_count
    value_type: integer
  - name: replaced
    value_type: boolean
  result_fields:
  - result.document_id
  - result.chunk_count
  - result.replaced
  error_codes:
  - invalid_payload
  - invalid_connection
  - unknown_action
  - effect_claim_required
  - test_mode_suppressed
  - authentication_failed
  - not_found
  - conflict
  - rate_limited
  - provider_unavailable
  - invalid_provider_response
  - response_too_large
  - network_blocked
- operation_id: delete_document
  display_name: Delete all chunks of a document
  description: Delete all stored chunks for a stable document ID within this account, project and connection. Does
    not delete the collection or raw points.
  operation_kind: action
  workflow_visible: true
  connection_type_ids:
  - qdrant
  category: retrieval
  inputs:
  - name: connection_ref
    value_type: connection_ref
    required: true
    display_name: Project connection
  - name: document_id
    value_type: text
    required: true
    display_name: Stable document ID
  outputs:
  - name: document_id
    value_type: text
  - name: deleted
    value_type: boolean
  result_fields:
  - result.document_id
  - result.deleted
  error_codes:
  - invalid_payload
  - invalid_connection
  - unknown_action
  - effect_claim_required
  - test_mode_suppressed
  - authentication_failed
  - not_found
  - conflict
  - rate_limited
  - provider_unavailable
  - invalid_provider_response
  - response_too_large
  - network_blocked
- operation_id: search
  display_name: Search similar text and build context
  description: Search the connection collection using a query embedding, optional Qdrant filter and score threshold.
    Returns matches, exact source excerpts and bounded context for an answer step; does not generate embeddings
    or an answer.
  operation_kind: action
  workflow_visible: true
  connection_type_ids:
  - qdrant
  category: retrieval
  inputs:
  - name: connection_ref
    value_type: connection_ref
    required: true
    display_name: Project connection
  - name: vector
    value_type: array
    required: false
    display_name: Question embedding (JSON array)
  - name: query_vectors
    value_type: array
    required: false
    display_name: Query embeddings (one-row JSON matrix)
  - name: filter
    value_type: json
    required: false
    display_name: Qdrant payload filter (JSON)
  - name: top_k
    value_type: integer
    required: false
    display_name: Maximum matches
    schema:
      type: integer
      minimum: 1
      maximum: 100
  - name: score_threshold
    value_type: number
    required: false
    display_name: Similarity score threshold
  - name: max_context_characters
    value_type: integer
    required: false
    display_name: Maximum context characters
    schema:
      type: integer
      minimum: 1
      maximum: 1000000
  outputs:
  - name: matches
    value_type: array
  - name: context
    value_type: text
  - name: sources
    value_type: array
  - name: match_count
    value_type: integer
  - name: truncated
    value_type: boolean
  - name: answerable
    value_type: boolean
  result_fields:
  - result.matches
  - result.context
  - result.sources
  - result.match_count
  - result.truncated
  - result.answerable
  error_codes:
  - invalid_payload
  - invalid_connection
  - unknown_action
  - effect_claim_required
  - test_mode_suppressed
  - authentication_failed
  - not_found
  - conflict
  - rate_limited
  - provider_unavailable
  - invalid_provider_response
  - response_too_large
  - network_blocked
- operation_id: ensure_indexes
  display_name: Ensure retrieval payload indexes
  description: Create keyword indexes for _fs_scope, _fs_kind and document_id on an existing collection. Required
    for scoped retrieval under Qdrant strict mode; needs administration privileges.
  operation_kind: action
  workflow_visible: true
  connection_type_ids:
  - qdrant
  category: retrieval
  inputs:
  - name: connection_ref
    value_type: connection_ref
    required: true
    display_name: Project connection
  outputs:
  - name: collection
    value_type: text
  - name: indexes_ready
    value_type: boolean
  result_fields:
  - result.collection
  - result.indexes_ready
  error_codes:
  - invalid_payload
  - invalid_connection
  - unknown_action
  - effect_claim_required
  - test_mode_suppressed
  - authentication_failed
  - not_found
  - conflict
  - rate_limited
  - provider_unavailable
  - invalid_provider_response
  - response_too_large
  - network_blocked
